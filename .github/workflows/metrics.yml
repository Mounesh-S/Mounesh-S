# Generates the "telemetry" SVGs directly into this repo (assets/).
# This replaces github-readme-stats / github-profile-trophy / activity-graph,
# whose free public instances are currently returning "Payment required".
name: Metrics

on:
  schedule:
    - cron: "0 2 * * *"        # daily, 02:00 UTC (07:30 IST)
  workflow_dispatch:            # lets you run it by hand from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  overview:
    name: Overview card
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Mounesh-S
          filename: assets/metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          base_indepth: yes
          config_timezone: Asia/Kolkata
          extras_css: |
            :root{--color-calendar-graph-day-bg:#161B26;--color-calendar-graph-day-border:rgba(148,163,184,.18)}
            svg{background:#0D1117;color:#C9CEDA}
            h1,h2{color:#D4AF37}
            .field svg{fill:#94A3B8}
          config_display: large
          plugin_lines: yes
          plugin_lines_history_limit: 1

  isocalendar:
    name: 3D contribution calendar
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Mounesh-S
          filename: assets/metrics.isocalendar.svg
          base: ""
          config_timezone: Asia/Kolkata
          extras_css: |
            :root{--color-calendar-graph-day-bg:#161B26;--color-calendar-graph-day-border:rgba(148,163,184,.18)}
            svg{background:#0D1117;color:#C9CEDA}
            h1,h2{color:#D4AF37}
            .field svg{fill:#94A3B8}
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

  languages:
    name: Language breakdown
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Mounesh-S
          filename: assets/metrics.languages.svg
          base: ""
          config_timezone: Asia/Kolkata
          extras_css: |
            :root{--color-calendar-graph-day-bg:#161B26;--color-calendar-graph-day-border:rgba(148,163,184,.18)}
            svg{background:#0D1117;color:#C9CEDA}
            h1,h2{color:#D4AF37}
            .field svg{fill:#94A3B8}
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%

  habits:
    name: Coding habits
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Mounesh-S
          filename: assets/metrics.habits.svg
          base: ""
          config_timezone: Asia/Kolkata
          extras_css: |
            :root{--color-calendar-graph-day-bg:#161B26;--color-calendar-graph-day-border:rgba(148,163,184,.18)}
            svg{background:#0D1117;color:#C9CEDA}
            h1,h2{color:#D4AF37}
            .field svg{fill:#94A3B8}
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
