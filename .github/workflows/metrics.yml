# Generates the "telemetry" SVGs directly into this repo (assets/).
# This replaces github-readme-stats / github-profile-trophy / activity-graph,
# whose free public instances are currently returning "Payment required".
name: Metrics

on:
  schedule:
    - cron: "0 2 * * *"        # daily, 02:00 UTC (07:30 IST)
  workflow_dispatch:            # lets you run it by hand from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  overview:
    name: Overview card
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Mounesh-S
          filename: assets/metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          base_indepth: yes
          config_timezone: Asia/Kolkata
          extras_css: |
            :root{--color-calendar-graph-day-bg:#161B26;--color-calendar-graph-day-border:rgba(148,163,184,.18)}
            svg{background:#0D1117;color:#C9CEDA}
            path[fill="#ebedf0"]{fill:#161B26}
            h1,h2{color:#D4AF37}
            .field svg{fill:#94A3B8}
          config_display: large
          plugin_lines: yes
          plugin_lines_history_limit: 1

  isocalendar:
    name: 3D contribution calendar
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Mounesh-S
          filename: assets/metrics.isocalendar.svg
          base: ""
          config_timezone: Asia/Kolkata
          extras_css: |
            :root{--color-calendar-graph-day-bg:#161B26;--color-calendar-graph-day-border:rgba(148,163,184,.18)}
            svg{background:#0D1117;color:#C9CEDA}
            path[fill="#ebedf0"]{fill:#161B26}
            h1,h2{color:#D4AF37}
            .field svg{fill:#94A3B8}
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

  languages:
    name: Language breakdown
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Mounesh-S
          filename: assets/metrics.languages.svg
          base: ""
          config_timezone: Asia/Kolkata
          extras_css: |
            :root{--color-calendar-graph-day-bg:#161B26;--color-calendar-graph-day-border:rgba(148,163,184,.18)}
            svg{background:#0D1117;color:#C9CEDA}
            path[fill="#ebedf0"]{fill:#161B26}
            h1,h2{color:#D4AF37}
            .field svg{fill:#94A3B8}
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%

# The "Coding habits" job was removed: this account has zero PushEvents in
# its public history (real commit history lives pre-transfer on the old
# account, and GitHub doesn't carry event history across a repo transfer),
# so plugin_habits always rendered an empty card no matter the time window.
# assets/op_shiplog.svg fills that slot instead, and the Log Pose gauges
# were repointed at real numbers too -- both are regenerated below by
# scripts/gen_dynamic_logpose.py, which just re-reads what the Overview
# card already fetched (no extra API calls, no drift between the two).

  dynamic:
    name: Log Pose + Ship's Log (live numbers)
    needs: overview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: git pull --ff-only origin main
      - run: python3 scripts/gen_dynamic_logpose.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/op_logpose.svg assets/op_shiplog.svg
          git diff --cached --quiet || git commit -m "chore: refresh Log Pose + Ship's Log with live numbers"
          git push
