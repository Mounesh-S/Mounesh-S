# Writes distinct recent public GitHub events as real markdown text between the
# START_SECTION/END_SECTION markers in README.md -- no image, nothing to hotlink.
name: Recent activity

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes
  workflow_dispatch:

concurrency:
  group: profile-activity
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/gen_activity_feed.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: update recent activity"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push; then exit 0; fi
            done
            exit 1
          fi
