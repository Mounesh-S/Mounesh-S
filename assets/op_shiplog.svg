<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 166" width="480" height="166" role="img" aria-label="Ship's log -- live voyage stats">
<title>Ship's Log -- live voyage stats</title>
<defs>
  <linearGradient id="slLine" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#D4AF37" stop-opacity="0"/><stop offset="50%" stop-color="#D4AF37" stop-opacity="0.6"/><stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
  </linearGradient>
</defs>
<rect width="480" height="166" rx="10" fill="#0D1117" stroke="#2A3447" stroke-width="1.2"/>
<text x="18" y="27" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#D4AF37">&#128220; SHIP&#8217;S LOG</text>
<text x="462" y="27" text-anchor="end" font-family="ui-monospace, monospace" font-size="9.5" fill="#94A3B8" font-style="italic">updated daily by Actions</text>
<line x1="18" y1="36" x2="462" y2="36" stroke="url(#slLine)" stroke-width="1"/>

<g font-family="ui-monospace, monospace" font-size="11" fill="#E2E8F0">
  <text x="18" y="58"><tspan fill="#38BDF8">&#9875; </tspan>642 commits logged</text>
  <text x="18" y="78"><tspan fill="#38BDF8">&#9875; </tspan>12 vessels commissioned</text>
  <text x="18" y="98"><tspan fill="#38BDF8">&#9875; </tspan>790 MB cargo held</text>
  <text x="18" y="118"><tspan fill="#38BDF8">&#9875; </tspan>sailing these waters 1 year</text>
</g>

<line x1="18" y1="132" x2="462" y2="132" stroke="#2A3447" stroke-width="1"/>
<text x="18" y="150" font-family="Georgia, serif" font-size="9.5" fill="#94A3B8" font-style="italic">Live numbers -- refreshed on every metrics run, same as the cards above.</text>
</svg>